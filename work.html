<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تفاصيل المنجز | بوابة المنجزات</title>

  <link rel="stylesheet" href="style.css?v=20261019-inline-edit">

  <style>
    .work-page {
      min-height: 100vh;
      padding: 50px 25px;
      background: #f5f7f8;
    }

    .work-page-container {
      width: min(1040px, 100%);
      margin: 0 auto;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 25px;
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      background: #0f6263;
      color: white;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      text-decoration: none;
    }

    .work-details-card {
      background: white;
      border-radius: 22px;
      padding: 30px 35px 35px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .work-hero {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(260px, .85fr);
      gap: 28px;
      align-items: start;
      margin-bottom: 28px;
    }

    .work-summary { min-width: 0; }
    .work-summary h1 { overflow-wrap: anywhere; }
    .work-summary .work-category,
    .work-summary .work-status { margin-bottom: 12px; }

    .work-section {
      border-top: 1px solid #e8eeee;
      padding-top: 22px;
      margin-top: 24px;
    }
    .work-section h2 { margin: 0 0 12px; font-size: 21px; color: #123e55; }
    .work-section p { margin: 0; line-height: 2; white-space: pre-wrap; }
    .work-attachments .attachment-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .work-cover {
      width: 100%;
      min-width: 0;
      height: auto;
      min-height: 0;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: transparent;
    }

    .work-cover img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: min(65vh, 620px);
      object-fit: contain;
      background: transparent;
    }

    .work-cover-empty {
      color: #718087;
      font-size: 14px;
    }

    .attachment-preview {
      display: block;
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      border-radius: 10px;
      margin-top: 8px;
      background: #f3f6f6;
    }

    .attachment-link {
      flex-wrap: wrap;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .work-page { padding: 20px 12px; }
      .work-details-card { padding: 18px 18px 22px; border-radius: 16px; }
      .work-hero { grid-template-columns: 1fr; gap: 20px; }
      .work-cover { height: auto; min-height: 0; }
      .work-cover img { max-height: 52vh; }
      .work-details-card h1 { font-size: 25px; }
      .work-attachments .attachment-list { grid-template-columns: 1fr; }
    }

    .work-status {
      display: inline-block;
      margin: 0 0 15px 8px;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }

    .work-status.status-approved { background: #e2f5e9; color: #17663a; }
    .work-status.status-pending { background: #fff2d8; color: #8a5a00; }
    .work-status.status-revision { background: #fde7e7; color: #9d2525; }

    .work-category {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 20px;
      background: #edf6f5;
      color: #0f6263;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .work-details-card h1 {
      margin: 0 0 25px;
      font-size: 32px;
    }

    .work-description {
      line-height: 2;
      font-size: 17px;
      white-space: pre-wrap;
      margin-bottom: 0;
    }

    .work-meta {
      border-top: 1px solid #eee;
      margin-top: 22px;
      padding-top: 18px;
      line-height: 2;
      color: #666;
    }

    .work-attachments {
      margin-top: 28px;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }

    .work-attachments h2 {
      font-size: 20px;
      margin: 0 0 14px;
    }

    .attachment-list {
      display: grid;
      gap: 10px;
    }

    .attachment-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid #dbe5e6;
      border-radius: 10px;
      overflow-wrap: anywhere;
      color: #0f6263;
      background: #fbfdfd;
    }

    .attachment-empty {
      color: #777;
      font-size: 14px;
    }

    .work-loading,
    .work-error {
      text-align: center;
      padding: 50px 20px;
    }

    .work-error {
      color: #a33;
    }

    .work-actions {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .work-actions button {
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
    }

    /* توزيع متوازن لتفاصيل المنجز */
    .work-details-card {
      padding: clamp(18px, 3vw, 34px);
    }

    .work-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: clamp(20px, 3vw, 34px);
      align-items: start;
    }

    .work-cover {
      min-width: 0;
      width: 100%;
      min-height: 280px;
      aspect-ratio: 4 / 3;
      padding: 12px;
      border: 1px solid #e3ebec;
      border-radius: 16px;
      background: #f6f9f9;
    }

    .work-cover img {
      width: 100%;
      height: 100%;
      max-height: 560px;
      object-fit: contain;
      border-radius: 10px;
    }

    .work-cover-empty {
      padding: 24px;
      text-align: center;
      line-height: 1.8;
    }

    .work-summary {
      min-width: 0;
      padding: 4px 0;
    }

    .work-summary h1 {
      margin: 14px 0 16px;
      font-size: clamp(24px, 2.4vw, 32px);
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .work-description {
      font-size: 16px;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    .work-meta {
      display: grid;
      gap: 4px;
      margin-top: 20px;
      overflow-wrap: anywhere;
    }

    .work-attachments .attachment-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
    }

    .work-attachments .attachment-link {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .work-attachments .attachment-link > span {
      overflow-wrap: anywhere;
    }

    .work-attachments .attachment-preview {
      width: 100%;
      height: 180px;
      max-height: 180px;
      object-fit: contain;
      margin-top: 4px;
    }

    @media (max-width: 700px) {
      .work-page { padding: 18px 12px; }
      .work-details-card { padding: 16px; }
      .work-hero { grid-template-columns: minmax(0, 1fr); gap: 18px; }
      .work-cover { min-height: 0; aspect-ratio: 4 / 3; }
      .work-cover img { max-height: 42vh; }
      .work-summary h1 { font-size: 25px; }
      .work-attachments .attachment-list { grid-template-columns: minmax(0, 1fr); }
      .work-attachments .attachment-preview { height: 200px; max-height: 200px; }
    }


    /* تفاصيل المنجز: بطاقة واحدة بتمرير داخلي */
    html, body { width:100%; height:100%; min-height:0; margin:0; background:transparent; }
    .work-page { width:100%; height:100%; min-height:0; padding:0; background:transparent; }
    .work-page-container { width:100%; height:100%; max-width:none; margin:0; }
    .work-details-card { box-sizing:border-box; display:flex; flex-direction:column; width:100%; height:100%; max-height:90vh; padding:0; overflow:hidden; border-radius:20px; background:#fff; box-shadow:none; }
    .work-details-header { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 24px; border-bottom:1px solid #e7ecef; background:#fff; }
    .work-details-header h1 { margin:0; font-size:20px; line-height:1.4; color:#123e55; }
    .work-close-button { flex:0 0 38px; width:38px; height:38px; border:0; border-radius:50%; background:#5865d8; color:#fff; font-size:27px; cursor:pointer; }
    .work-details-content { flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:24px; scrollbar-width:thin; scrollbar-color:#b8c5ce transparent; }
    .work-details-content::-webkit-scrollbar { width:6px; }
    .work-details-content::-webkit-scrollbar-thumb { background:#b8c5ce; border-radius:8px; }
    .work-details-content::-webkit-scrollbar-track { background:transparent; }
    .work-hero { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; align-items:start; margin:0; }
    .work-cover { display:block; width:100%; min-width:0; min-height:0; height:auto; aspect-ratio:16/9; padding:0; border:0; border-radius:14px; background:transparent; overflow:hidden; }
    .work-cover img { display:block; width:100%; height:100%; max-height:none; object-fit:cover; border-radius:14px; }
    .work-summary { min-width:0; padding:0; }
    .work-badges { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .work-category,.work-status { box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center; min-height:30px; margin:0; }
    .work-summary h2 { margin:12px 0 4px; font-size:clamp(24px,2.5vw,32px); line-height:1.4; overflow-wrap:anywhere; }
    .work-short-description { margin:0; color:#687780; line-height:1.8; white-space:pre-wrap; overflow-wrap:anywhere; }
    .work-meta { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin-top:16px; padding:0; border:0; }
    .work-meta-item { display:flex; flex-direction:column; gap:4px; min-width:0; overflow-wrap:anywhere; }
    .work-meta-item span { color:#77848b; font-size:12px; }
    .work-meta-item strong { color:#1c3444; font-size:14px; font-weight:600; }
    .work-extra-fields { display:grid; gap:16px; margin-top:24px; }
    .work-section { margin:0; padding-top:12px; border-top:1px solid #e7ecef; }
    .work-section h2 { margin:0 0 8px; font-size:16px; color:#123e55; }
    .work-section p { max-width:70ch; margin:0; line-height:1.9; white-space:pre-wrap; overflow-wrap:anywhere; }
    .work-attachments { margin-top:16px; padding-top:12px; }
    .work-attachments .attachment-list { grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
    .work-attachments .attachment-link { padding:10px; }
    .work-attachments .attachment-preview { height:120px; max-height:120px; object-fit:cover; }
    .work-details-footer { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; padding:14px 24px; border-top:1px solid #e7ecef; background:#fff; }
    .work-admin-actions,.work-navigation-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .work-btn { min-height:40px; padding:9px 15px; border:1px solid transparent; border-radius:9px; font:inherit; font-size:14px; cursor:pointer; }
    .work-btn-edit { background:#2463b8; color:#fff; }
    .work-btn-delete { background:#fff; color:#b42318; border-color:#d92d20; }
    .work-btn-home { background:#fff; color:#123e55; border-color:#cbd5dc; }
    .work-btn-close { background:#eef1f3; color:#344854; }
    .work-admin-actions[hidden] { display:none; }
    @media(max-width:700px) {
      .work-details-card { max-height:94vh; border-radius:15px; }
      .work-details-header { padding:12px 16px; }
      .work-details-content { padding:16px; }
      .work-hero { grid-template-columns:minmax(0,1fr); gap:16px; }
      .work-cover { order:0; }
      .work-summary { order:1; }
      .work-details-footer { padding:12px 16px; align-items:stretch; }
      .work-admin-actions,.work-navigation-actions { width:100%; }
      .work-btn { flex:1 1 auto; }
    }
    .work-media-column { min-width:0; }
    .work-thumbnails { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    .work-thumb { display:block; width:64px; height:52px; overflow:hidden; border-radius:8px; }
    .work-thumb img { width:100%; height:100%; object-fit:cover; display:block; }


    .achievement-edit-form { display:grid; gap:16px; max-width:850px; margin:0 auto; color:#193746; }
    .achievement-edit-form h2 { margin:0; font-size:23px; color:#123e55; }
    .edit-request-intro { margin:0; color:#61717b; line-height:1.8; }
    .edit-request-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .edit-request-field { display:flex; flex-direction:column; gap:7px; min-width:0; font-size:14px; font-weight:600; color:#344854; }
    .edit-request-field input,.edit-request-field select,.edit-request-field textarea { box-sizing:border-box; width:100%; min-width:0; padding:11px 12px; border:1px solid #cbd5dc; border-radius:9px; background:#fff; color:#183747; font:inherit; font-weight:400; }
    .edit-request-field textarea { resize:vertical; line-height:1.8; }
    .edit-request-field input:focus,.edit-request-field select:focus,.edit-request-field textarea:focus { outline:2px solid #9cc4ee; border-color:#2463b8; }
    .edit-request-preserve-note { padding:12px 14px; border-radius:10px; background:#f1f7fc; color:#345b77; font-size:13px; line-height:1.8; }
    .edit-request-actions { display:flex; flex-wrap:wrap; gap:10px; }
    .edit-request-status { margin:0; color:#a33; overflow-wrap:anywhere; }
    @media(max-width:600px) { .edit-request-grid { grid-template-columns:minmax(0,1fr); } .edit-request-actions { flex-direction:column; } .edit-request-actions .work-btn { width:100%; } }

    /* Hotfix: override legacy details styles that constrained the inner card */
    html, body, .work-page, .work-page-container { box-sizing:border-box !important; width:100% !important; max-width:none !important; min-width:0 !important; margin:0 !important; }
    .work-page { height:100% !important; min-height:0 !important; padding:0 !important; overflow:hidden !important; }
    .work-page-container { height:100% !important; padding:0 !important; }
    .work-details-card { box-sizing:border-box !important; display:flex !important; flex-direction:column !important; width:100% !important; max-width:none !important; min-width:0 !important; height:100% !important; max-height:90vh !important; margin:0 !important; padding:0 !important; overflow:hidden !important; border-radius:20px !important; }
    .work-details-header { flex:0 0 auto !important; width:100% !important; box-sizing:border-box !important; }
    .work-details-content { flex:1 1 auto !important; width:100% !important; min-width:0 !important; min-height:0 !important; box-sizing:border-box !important; overflow-y:auto !important; overflow-x:hidden !important; }
    .work-hero { display:grid !important; grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important; width:100% !important; min-width:0 !important; gap:24px !important; direction:rtl !important; }
    .work-media-column,.work-summary { min-width:0 !important; width:100% !important; }
    .work-cover { width:100% !important; min-width:0 !important; height:auto !important; min-height:0 !important; aspect-ratio:16/9 !important; padding:0 !important; border:0 !important; background:transparent !important; }
    .work-cover img { width:100% !important; height:100% !important; max-width:none !important; max-height:none !important; object-fit:cover !important; }
    .work-details-footer { flex:0 0 auto !important; width:100% !important; box-sizing:border-box !important; }
    @media(max-width:700px) {
      .work-details-card { max-height:94vh !important; }
      .work-hero { grid-template-columns:minmax(0,1fr) !important; gap:16px !important; }
    }

  </style>
</head>

<body>

  <main class="work-page">

    <div class="work-page-container">

      <section class="work-details-card" aria-label="بطاقة تفاصيل المنجز">
        <header class="work-details-header">
          <h1>تفاصيل المنجز</h1>
          <button class="work-close-button" type="button" aria-label="إغلاق">×</button>
        </header>
        <div id="workDetails" class="work-details-content">
          <div class="work-loading">جاري تحميل المنجز...</div>
        </div>
        <footer class="work-details-footer">
          <div class="work-admin-actions" id="workOwnerActions" hidden>
            <button type="button" class="work-btn work-btn-edit" id="editWorkButton">تعديل</button>
          </div>
          <div class="work-admin-actions" id="workAdminActions" hidden>
            <button type="button" class="work-btn work-btn-delete" id="deleteWorkButton">حذف</button>
          </div>
          <div class="work-navigation-actions">
            <button type="button" class="work-btn work-btn-home" id="homeWorkButton">العودة إلى الصفحة الرئيسية</button>
            <button type="button" class="work-btn work-btn-close" id="closeWorkButton">إغلاق</button>
          </div>
        </footer>
      </section>

    </div>

  </main>

  <script type="module">

    const SUPABASE_URL =
      'https://jwsvfrqjmklanrcwviyr.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_SJ4ZYyJa0oCnPygbUPTiHw_-MXnOANX';

    const { createClient } =
      await import(
        'https://esm.sh/@supabase/supabase-js@2'
      );

    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

    const details =
      document.querySelector('#workDetails');

    const params =
      new URLSearchParams(window.location.search);

    const workId =
      params.get('id');

    const closeModal = () => {
      if (window.parent !== window) {
        window.parent.document.querySelector('#workDetailsModal .work-details-modal-close')?.click();
      } else {
        window.close();
      }
    };
    document.querySelector('.work-close-button')?.addEventListener('click', closeModal);
    document.querySelector('#closeWorkButton')?.addEventListener('click', closeModal);
    document.querySelector('#homeWorkButton')?.addEventListener('click', () => {
      if (window.parent !== window) {
        window.parent.document.querySelector('#workDetailsModal .work-details-modal-close')?.click();
        window.parent.location.hash = '#home';
      } else {
        window.location.href = 'index.html#home';
      }
    });
    const adminMode = params.get('admin') === '1';
    const ownerActions = document.querySelector('#workOwnerActions');
    const adminActions = document.querySelector('#workAdminActions');
    let currentWork = null;
    let currentUserId = null;
    let currentRole = 'guest';
    (async () => {
      try {
        const { data: { session } } = await supabase.auth.getSession();
        currentUserId = session?.user?.id || null;
        if (currentUserId) {
          const { data: profile } = await supabase.from('profiles').select('role').eq('id', currentUserId).maybeSingle();
          currentRole = profile?.role || 'member';
        }
        if (ownerActions && currentWork && currentUserId && (String(currentWork.created_by || '') === String(currentUserId) || currentRole === 'admin')) ownerActions.hidden = false;
        if (adminActions && currentRole === 'admin') adminActions.hidden = false;
      } catch (authError) { console.warn('تعذر التحقق من صلاحيات تفاصيل المنجز:', authError); }
    })();
    document.querySelector('#editWorkButton')?.addEventListener('click', () => {
      if (!currentWork || !currentUserId || (String(currentWork.created_by || '') !== String(currentUserId) && currentRole !== 'admin')) {
        alert('يمكنك تعديل منجزك أو يلزم تسجيل الدخول بحساب الإدارة.');
        return;
      }
      renderAchievementEditForm();
    });

    function renderAchievementEditForm() {
      const isAdmin = currentRole === 'admin';
      if (!currentWork || !currentUserId || (String(currentWork.created_by || '') !== String(currentUserId) && !isAdmin)) {
        alert('لا تملكين صلاحية تعديل هذا المنجز.');
        return;
      }
      const d = currentWork;
      const field = (id, label, value, type = 'text', required = false) => `
        <label class="edit-request-field" for="${id}">${label}${required ? ' *' : ''}
          <input id="${id}" name="${id}" type="${type}" value="${escapeHTML(value || '')}" ${required ? 'required' : ''}>
        </label>`;
      details.innerHTML = `
        <form id="achievementEditRequestForm" class="achievement-edit-form">
          <h2>${isAdmin ? 'تعديل المنجز' : 'اقتراح تعديل المنجز'}</h2>
          <p class="edit-request-intro">${isAdmin ? 'سيتم حفظ التعديلات مباشرة على بيانات المنجز.' : 'عدّلي البيانات المطلوبة هنا. لن تتغير البيانات المنشورة حتى تراجع الإدارة الطلب وتوافق عليه.'}</p>
          <div class="edit-request-grid">
            ${field('editTitle','عنوان المنجز',d.title,'text',true)}
            <label class="edit-request-field" for="editCategory">القسم / المجال *
              <select id="editCategory" name="category" required>
                <option value="">اختاري المجال</option>
                ${['تدريس','توجيه طلابي','نشاط طلابي','شراكة','منجز','نواتج تعلم','قيم','ورش','أولياء الأمور'].map(v => `<option value="${escapeHTML(v)}" ${d.category===v?'selected':''}>${escapeHTML(v)}</option>`).join('')}
                ${d.category && !['تدريس','توجيه طلابي','نشاط طلابي','شراكة','منجز','نواتج تعلم','قيم','ورش','أولياء الأمور'].includes(d.category) ? `<option selected value="${escapeHTML(d.category)}">${escapeHTML(d.category)}</option>` : ''}
              </select>
            </label>
            ${field('editDate','تاريخ التنفيذ',d.achievement_date,'date')}
            ${field('editSubmitter','اسم المنفذ',d.submitter_name)}
            ${field('editDepartment','القسم الإداري',d.department)}
            ${field('editAudience','الفئة المستهدفة',d.audience)}
            ${field('editEntity','الجهة المنفذة',d.entity)}
          </div>
          <label class="edit-request-field" for="editDescription">وصف المنجز *
            <textarea id="editDescription" name="description" rows="5" required>${escapeHTML(d.description || '')}</textarea>
          </label>
          <div class="edit-request-grid">
            <label class="edit-request-field" for="editGoal">الهدف من المنجز
              <textarea id="editGoal" name="goal" rows="3">${escapeHTML(d.goal || '')}</textarea>
            </label>
            <label class="edit-request-field" for="editImpact">الأثر والنتائج
              <textarea id="editImpact" name="impact" rows="3">${escapeHTML(d.impact || '')}</textarea>
            </label>
            <label class="edit-request-field" for="editShortDescription">نبذة مختصرة
              <textarea id="editShortDescription" name="short_description" rows="3">${escapeHTML(d.short_description || '')}</textarea>
            </label>
          </div>
          <div class="edit-request-preserve-note">صورة الغلاف والمرفقات الحالية ستبقى كما هي، ولا يمكن تغييرها من طلب التعديل هذا.</div>
          <div class="edit-request-actions">
            <button type="submit" class="work-btn work-btn-edit" id="submitAchievementEditRequest">${isAdmin ? 'حفظ التعديلات' : 'إرسال طلب التعديل للمراجعة'}</button>
            <button type="button" class="work-btn work-btn-home" id="cancelAchievementEditRequest">إلغاء والعودة للتفاصيل</button>
          </div>
          <p id="editRequestStatus" class="edit-request-status" role="status" aria-live="polite"></p>
        </form>`;
      document.querySelector('#cancelAchievementEditRequest')?.addEventListener('click', () => loadWork());
      document.querySelector('#achievementEditRequestForm')?.addEventListener('submit', submitAchievementEditRequest);
    }

    async function submitAchievementEditRequest(event) {
      event.preventDefault();
      const isAdmin = currentRole === 'admin';
      if (!currentWork || !currentUserId || (String(currentWork.created_by || '') !== String(currentUserId) && !isAdmin)) {
        alert('انتهت صلاحية الجلسة أو لا تملكين صلاحية تعديل هذا المنجز. سجّلي الدخول ثم حاولي مجددًا.');
        return;
      }
      const form = event.currentTarget;
      const submitButton = document.querySelector('#submitAchievementEditRequest');
      const status = document.querySelector('#editRequestStatus');
      const formData = new FormData(form);
      const proposedData = {
        title: String(formData.get('editTitle') || '').trim(),
        category: String(formData.get('category') || '').trim(),
        achievement_date: String(formData.get('editDate') || '') || null,
        submitter_name: String(formData.get('editSubmitter') || '').trim(),
        department: String(formData.get('editDepartment') || '').trim(),
        audience: String(formData.get('editAudience') || '').trim(),
        entity: String(formData.get('editEntity') || '').trim(),
        description: String(formData.get('description') || '').trim(),
        goal: String(formData.get('goal') || '').trim(),
        impact: String(formData.get('impact') || '').trim(),
        short_description: String(formData.get('short_description') || '').trim()
      };
      if (!proposedData.title || !proposedData.category || !proposedData.description) {
        if (status) status.textContent = 'يرجى تعبئة عنوان المنجز والمجال والوصف.';
        return;
      }
      submitButton.disabled = true;
      submitButton.textContent = isAdmin ? 'جارٍ حفظ التعديلات…' : 'جارٍ إرسال الطلب…';
      if (status) status.textContent = '';
      try {
        if (isAdmin) {
          const { error: updateError } = await supabase.from('achievements').update(proposedData).eq('id', workId);
          if (updateError) throw updateError;
          alert('تم حفظ تعديلات المنجز.');
          await loadWork();
          return;
        }
        const { data: pending, error: pendingError } = await supabase
          .from('achievement_edit_requests')
          .select('id')
          .eq('achievement_id', workId)
          .eq('requested_by', currentUserId)
          .eq('status', 'pending')
          .limit(1);
        if (pendingError) throw pendingError;
        if (pending?.length) {
          if (status) status.textContent = 'لديك طلب تعديل قيد المراجعة لهذا المنجز بالفعل. انتظري قرار الإدارة قبل إرسال طلب جديد.';
          submitButton.disabled = false;
          submitButton.textContent = 'إرسال طلب التعديل للمراجعة';
          return;
        }
        const { error } = await supabase.from('achievement_edit_requests').insert({
          achievement_id: Number(workId),
          requested_by: currentUserId,
          proposed_data: proposedData,
          status: 'pending'
        });
        if (error) throw error;
        alert('تم إرسال طلب التعديل للإدارة. ستبقى بيانات المنجز الحالية ظاهرة حتى اعتماد الطلب.');
        await loadWork();
      } catch (error) {
        console.error('تعذر إرسال طلب تعديل المنجز:', error);
        if (status) status.textContent = 'تعذر إرسال الطلب: ' + (error?.message || 'خطأ غير معروف');
        submitButton.disabled = false;
        submitButton.textContent = 'إرسال طلب التعديل للمراجعة';
      }
    }
    document.querySelector('#deleteWorkButton')?.addEventListener('click', async () => {
      if (!adminMode || !workId || !confirm('تأكيد حذف هذا المنجز؟')) return;
      const { error } = await supabase.from('achievements').delete().eq('id', workId);
      if (error) { alert('تعذر حذف المنجز: ' + error.message); return; }
      closeModal();
      if (window.parent !== window) window.parent.location.hash = '#works';
    });

    function escapeHTML(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function loadWork() {

      if (!workId) {
        details.innerHTML = `
          <div class="work-error">
            لم يتم تحديد المنجز.
          </div>
        `;
        return;
      }

      const { data, error } =
        await supabase
          .from('achievements')
          .select('*')
          .eq('id', workId)
          .single();

      if (error || !data) {
        console.error(error);

        details.innerHTML = `
          <div class="work-error">
            تعذر تحميل المنجز.
          </div>
        `;

        return;
      }

      currentWork = data;
      if (ownerActions && currentUserId && (String(data.created_by || '') === String(currentUserId) || currentRole === 'admin')) ownerActions.hidden = false;
      if (adminActions && currentRole === 'admin') adminActions.hidden = false;
      document.title =
        `${data.title || 'تفاصيل المنجز'} | بوابة المنجزات`;

      const { data: attachments, error: attachmentError } = await supabase
        .from('achievement_attachments')
        .select('file_name,file_path,mime_type,is_cover')
        .eq('achievement_id', workId)
        .order('created_at', { ascending: true });

      if (attachmentError) {
        console.error('تعذر تحميل مرفقات المنجز:', attachmentError);
      }

      const preparedAttachments = await Promise.all((attachments || []).map(async file => {
        const { data: publicData } = supabase.storage
          .from('achievement-files')
          .getPublicUrl(file.file_path);
        let url = publicData?.publicUrl || '';
        if (!url && file.file_path) {
          const { data: signedData } = await supabase.storage
            .from('achievement-files')
            .createSignedUrl(file.file_path, 3600);
          url = signedData?.signedUrl || '';
        }
        return { ...file, url };
      }));

      const cover = preparedAttachments.find(file => file.is_cover && (file.mime_type || '').startsWith('image/') && file.url)
        || preparedAttachments.find(file => (file.mime_type || '').startsWith('image/') && file.url);
      const thumbnailMarkup = preparedAttachments
        .filter(file => file !== cover && (file.mime_type || '').startsWith('image/') && file.url)
        .map(file => `<a class="work-thumb" href="${escapeHTML(file.url)}" target="_blank" rel="noopener"><img src="${escapeHTML(file.url)}" alt="${escapeHTML(file.file_name || 'صورة إضافية')}" loading="lazy"></a>`)
        .join('');
      const attachmentMarkup = preparedAttachments.filter(file => !file.is_cover && file !== cover).map(file => {
        const mime = file.mime_type || '';
        const isImage = mime.startsWith('image/');
        const isVideo = mime.startsWith('video/');
        const typeLabel = isImage ? 'صورة' : (isVideo ? 'فيديو' : 'PDF');
        const preview = isImage && file.url
          ? `<img class="attachment-preview" src="${escapeHTML(file.url)}" alt="${escapeHTML(file.file_name || 'صورة مرفقة')}" loading="lazy">`
          : (isVideo && file.url
            ? `<video class="attachment-preview" controls preload="metadata"><source src="${escapeHTML(file.url)}" type="${escapeHTML(mime)}">المتصفح لا يدعم تشغيل الفيديو.</video>`
            : '');
        return `
          <a class="attachment-link" href="${escapeHTML(file.url || '#')}" target="_blank" rel="noopener noreferrer">
            <span aria-hidden="true">${typeLabel}</span>
            <span>${escapeHTML(file.file_name || 'مرفق')}</span>
            ${preview}
          </a>
        `;
      }).join('');

      const metaItems = [
        ['التاريخ', data.achievement_date],
        ['المنفذ', data.submitter_name],
        ['الجهة', data.entity],
        ['الفئة المستهدفة', data.audience],
        ['عدد المستفيدات', data.beneficiaries_count ?? data.beneficiaries]
      ].filter(([, value]) => value != null && String(value).trim());
      details.innerHTML = `
        <div class="work-hero">
          <div class="work-media-column">
            <div class="work-cover">
              ${cover
                ? `<img src="${escapeHTML(cover.url)}" alt="${escapeHTML(data.title || 'غلاف المنجز')}" fetchpriority="high">`
                : '<div class="work-cover-empty">لا توجد صورة مرفقة لهذا المنجز</div>'}
            </div>
            ${thumbnailMarkup ? `<div class="work-thumbnails">${thumbnailMarkup}</div>` : ''}
          </div>
          <div class="work-summary">
            <div class="work-badges">
              <span class="work-category">${escapeHTML(data.category || 'منجز')}</span>
              <span class="work-status ${(['published', 'approved'].includes(data.status) ? 'status-approved' : (['needs_edit', 'rejected'].includes(data.status) ? 'status-revision' : 'status-pending'))}">${escapeHTML(({published:'معتمد', approved:'معتمد', pending:'قيد المراجعة', under_review:'قيد المراجعة', needs_edit:'بحاجة إلى تعديل', rejected:'غير معتمد'})[data.status] || data.status || 'قيد المراجعة')}</span>
            </div>
            <h2>${escapeHTML(data.title || 'بدون عنوان')}</h2>
            ${data.short_description ? `<p class="work-short-description">${escapeHTML(data.short_description)}</p>` : ''}
            <div class="work-meta">
              ${metaItems.map(([label,value]) => `<div class="work-meta-item"><span>${escapeHTML(label)}</span><strong>${escapeHTML(value)}</strong></div>`).join('')}
            </div>
          </div>
        </div>
        <div class="work-extra-fields">
          ${[
            ['الهدف', data.goal],
            ['الوصف', data.description],
            ['الأثر', data.impact]
          ].filter(([, value]) => value && String(value).trim()).map(([label, value]) => `<section class="work-section"><h2>${escapeHTML(label)}</h2><p>${escapeHTML(value)}</p></section>`).join('')}
        </div>
        ${attachmentMarkup || data.external_url ? `<section class="work-attachments work-section" aria-labelledby="attachmentsTitle"><h2 id="attachmentsTitle">المرفقات</h2><div class="attachment-list">${attachmentMarkup}</div>${data.external_url ? `<p><a class="attachment-link" href="${escapeHTML(data.external_url)}" target="_blank" rel="noopener noreferrer">فتح الرابط الخارجي</a></p>` : ''}</section>` : ''}
      `;
    }

    loadWork().catch(error => {
      console.error(error);
      details.innerHTML = '<div class="work-error">حدث خطأ أثناء تحميل تفاصيل المنجز.</div>';
    });

  </script>

</body>
</html>
