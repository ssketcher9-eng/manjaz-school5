<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تفاصيل المنجز | بوابة المنجزات</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .work-page {
      min-height: 100vh;
      padding: 50px 25px;
      background: #f5f7f8;
    }

    .work-page-container {
      width: min(1040px, 100%);
      margin: 0 auto;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 25px;
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      background: #0f6263;
      color: white;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      text-decoration: none;
    }

    .work-details-card {
      background: white;
      border-radius: 22px;
      padding: 30px 35px 35px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .work-hero {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(260px, .85fr);
      gap: 28px;
      align-items: start;
      margin-bottom: 28px;
    }

    .work-summary { min-width: 0; }
    .work-summary h1 { overflow-wrap: anywhere; }
    .work-summary .work-category,
    .work-summary .work-status { margin-bottom: 12px; }

    .work-section {
      border-top: 1px solid #e8eeee;
      padding-top: 22px;
      margin-top: 24px;
    }
    .work-section h2 { margin: 0 0 12px; font-size: 21px; color: #123e55; }
    .work-section p { margin: 0; line-height: 2; white-space: pre-wrap; }
    .work-attachments .attachment-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .work-cover {
      width: 100%;
      min-width: 0;
      height: auto;
      min-height: 0;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: transparent;
    }

    .work-cover img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: min(65vh, 620px);
      object-fit: contain;
      background: transparent;
    }

    .work-cover-empty {
      color: #718087;
      font-size: 14px;
    }

    .attachment-preview {
      display: block;
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      border-radius: 10px;
      margin-top: 8px;
      background: #f3f6f6;
    }

    .attachment-link {
      flex-wrap: wrap;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      .work-page { padding: 20px 12px; }
      .work-details-card { padding: 18px 18px 22px; border-radius: 16px; }
      .work-hero { grid-template-columns: 1fr; gap: 20px; }
      .work-cover { height: auto; min-height: 0; }
      .work-cover img { max-height: 52vh; }
      .work-details-card h1 { font-size: 25px; }
      .work-attachments .attachment-list { grid-template-columns: 1fr; }
    }

    .work-status {
      display: inline-block;
      margin: 0 0 15px 8px;
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }

    .work-status.status-approved { background: #e2f5e9; color: #17663a; }
    .work-status.status-pending { background: #fff2d8; color: #8a5a00; }
    .work-status.status-revision { background: #fde7e7; color: #9d2525; }

    .work-category {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 20px;
      background: #edf6f5;
      color: #0f6263;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .work-details-card h1 {
      margin: 0 0 25px;
      font-size: 32px;
    }

    .work-description {
      line-height: 2;
      font-size: 17px;
      white-space: pre-wrap;
      margin-bottom: 0;
    }

    .work-meta {
      border-top: 1px solid #eee;
      margin-top: 22px;
      padding-top: 18px;
      line-height: 2;
      color: #666;
    }

    .work-attachments {
      margin-top: 28px;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }

    .work-attachments h2 {
      font-size: 20px;
      margin: 0 0 14px;
    }

    .attachment-list {
      display: grid;
      gap: 10px;
    }

    .attachment-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1px solid #dbe5e6;
      border-radius: 10px;
      overflow-wrap: anywhere;
      color: #0f6263;
      background: #fbfdfd;
    }

    .attachment-empty {
      color: #777;
      font-size: 14px;
    }

    .work-loading,
    .work-error {
      text-align: center;
      padding: 50px 20px;
    }

    .work-error {
      color: #a33;
    }

    .work-actions {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .work-actions button {
      padding: 10px 18px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-family: inherit;
    }

    /* توزيع متوازن لتفاصيل المنجز */
    .work-details-card {
      padding: clamp(18px, 3vw, 34px);
    }

    .work-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: clamp(20px, 3vw, 34px);
      align-items: start;
    }

    .work-cover {
      min-width: 0;
      width: 100%;
      min-height: 280px;
      aspect-ratio: 4 / 3;
      padding: 12px;
      border: 1px solid #e3ebec;
      border-radius: 16px;
      background: #f6f9f9;
    }

    .work-cover img {
      width: 100%;
      height: 100%;
      max-height: 560px;
      object-fit: contain;
      border-radius: 10px;
    }

    .work-cover-empty {
      padding: 24px;
      text-align: center;
      line-height: 1.8;
    }

    .work-summary {
      min-width: 0;
      padding: 4px 0;
    }

    .work-summary h1 {
      margin: 14px 0 16px;
      font-size: clamp(24px, 2.4vw, 32px);
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .work-description {
      font-size: 16px;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    .work-meta {
      display: grid;
      gap: 4px;
      margin-top: 20px;
      overflow-wrap: anywhere;
    }

    .work-attachments .attachment-list {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
    }

    .work-attachments .attachment-link {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    .work-attachments .attachment-link > span {
      overflow-wrap: anywhere;
    }

    .work-attachments .attachment-preview {
      width: 100%;
      height: 180px;
      max-height: 180px;
      object-fit: contain;
      margin-top: 4px;
    }

    @media (max-width: 700px) {
      .work-page { padding: 18px 12px; }
      .work-details-card { padding: 16px; }
      .work-hero { grid-template-columns: minmax(0, 1fr); gap: 18px; }
      .work-cover { min-height: 0; aspect-ratio: 4 / 3; }
      .work-cover img { max-height: 42vh; }
      .work-summary h1 { font-size: 25px; }
      .work-attachments .attachment-list { grid-template-columns: minmax(0, 1fr); }
      .work-attachments .attachment-preview { height: 200px; max-height: 200px; }
    }

  </style>
</head>

<body>

  <main class="work-page">

    <div class="work-page-container">

      <a href="index.html#works" class="back-button">
        ← العودة إلى المنجزات
      </a>

      <section
        id="workDetails"
        class="work-details-card"
      >
        <div class="work-loading">
          جاري تحميل المنجز...
        </div>
      </section>

    </div>

  </main>

  <script type="module">

    const SUPABASE_URL =
      'https://jwsvfrqjmklanrcwviyr.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_SJ4ZYyJa0oCnPygbUPTiHw_-MXnOANX';

    const { createClient } =
      await import(
        'https://esm.sh/@supabase/supabase-js@2'
      );

    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

    const details =
      document.querySelector('#workDetails');

    const params =
      new URLSearchParams(window.location.search);

    const workId =
      params.get('id');

    // عند فتح التفاصيل داخل النافذة المنبثقة، أغلق النافذة بدل التنقل داخل الإطار.
    document.querySelector('.back-button')?.addEventListener('click', event => {
      if (window.parent !== window) {
        event.preventDefault();
        window.parent.document
          .querySelector('#workDetailsModal .work-details-modal-close')
          ?.click();
      }
    });

    function escapeHTML(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function loadWork() {

      if (!workId) {
        details.innerHTML = `
          <div class="work-error">
            لم يتم تحديد المنجز.
          </div>
        `;
        return;
      }

      const { data, error } =
        await supabase
          .from('achievements')
          .select('*')
          .eq('id', workId)
          .single();

      if (error || !data) {
        console.error(error);

        details.innerHTML = `
          <div class="work-error">
            تعذر تحميل المنجز.
          </div>
        `;

        return;
      }

      document.title =
        `${data.title || 'تفاصيل المنجز'} | بوابة المنجزات`;

      const { data: attachments, error: attachmentError } = await supabase
        .from('achievement_attachments')
        .select('file_name,file_path,mime_type,is_cover')
        .eq('achievement_id', workId)
        .order('created_at', { ascending: true });

      if (attachmentError) {
        console.error('تعذر تحميل مرفقات المنجز:', attachmentError);
      }

      const preparedAttachments = await Promise.all((attachments || []).map(async file => {
        const { data: publicData } = supabase.storage
          .from('achievement-files')
          .getPublicUrl(file.file_path);
        let url = publicData?.publicUrl || '';
        if (!url && file.file_path) {
          const { data: signedData } = await supabase.storage
            .from('achievement-files')
            .createSignedUrl(file.file_path, 3600);
          url = signedData?.signedUrl || '';
        }
        return { ...file, url };
      }));

      const cover = preparedAttachments.find(file => file.is_cover && (file.mime_type || '').startsWith('image/') && file.url)
        || preparedAttachments.find(file => (file.mime_type || '').startsWith('image/') && file.url);
      const attachmentMarkup = preparedAttachments.filter(file => !file.is_cover && file !== cover).map(file => {
        const mime = file.mime_type || '';
        const isImage = mime.startsWith('image/');
        const isVideo = mime.startsWith('video/');
        const typeLabel = isImage ? 'صورة' : (isVideo ? 'فيديو' : 'PDF');
        const preview = isImage && file.url
          ? `<img class="attachment-preview" src="${escapeHTML(file.url)}" alt="${escapeHTML(file.file_name || 'صورة مرفقة')}" loading="lazy">`
          : (isVideo && file.url
            ? `<video class="attachment-preview" controls preload="metadata"><source src="${escapeHTML(file.url)}" type="${escapeHTML(mime)}">المتصفح لا يدعم تشغيل الفيديو.</video>`
            : '');
        return `
          <a class="attachment-link" href="${escapeHTML(file.url || '#')}" target="_blank" rel="noopener noreferrer">
            <span aria-hidden="true">${typeLabel}</span>
            <span>${escapeHTML(file.file_name || 'مرفق')}</span>
            ${preview}
          </a>
        `;
      }).join('');

      details.innerHTML = `
        <div class="work-hero">
          <div class="work-cover">
            ${cover
              ? `<img src="${escapeHTML(cover.url)}" alt="${escapeHTML(data.title || 'غلاف المنجز')}" fetchpriority="high">`
              : '<div class="work-cover-empty">لا توجد صورة مرفقة لهذا المنجز</div>'}
          </div>

          <div class="work-summary">
            <span class="work-category">${escapeHTML(data.category || 'منجز')}</span>
            <span class="work-status ${(['published', 'approved'].includes(data.status) ? 'status-approved' : (['needs_edit', 'rejected'].includes(data.status) ? 'status-revision' : 'status-pending'))}">
              ${escapeHTML(({published:'معتمد', approved:'معتمد', pending:'قيد المراجعة', under_review:'قيد المراجعة', needs_edit:'بحاجة إلى تعديل', rejected:'غير معتمد'})[data.status] || data.status || 'قيد المراجعة')}
            </span>

            <h1>${escapeHTML(data.title || 'بدون عنوان')}</h1>
            <div class="work-description">
              ${escapeHTML(data.description || 'لا يوجد وصف لهذا المنجز.')}
            </div>

            <div class="work-meta">
              ${data.achievement_date ? `<div><strong>التاريخ:</strong> ${escapeHTML(data.achievement_date)}</div>` : ''}
              ${data.submitter_name ? `<div><strong>المنفذ:</strong> ${escapeHTML(data.submitter_name)}</div>` : ''}
            </div>
          </div>
        </div>

        <div class="work-extra-fields">
          ${[
            ['الهدف', data.goal],
            ['الأثر والنتائج', data.impact],
            ['الفئة المستهدفة', data.audience],
            ['الجهة المنفذة', data.entity]
          ].filter(([, value]) => value && String(value).trim()).map(([label, value]) => `
            <section class="work-section">
              <h2>${escapeHTML(label)}</h2>
              <p>${escapeHTML(value)}</p>
            </section>
          `).join('')}
        </div>

        <section class="work-attachments work-section" aria-labelledby="attachmentsTitle">
          <h2 id="attachmentsTitle">الصور والمرفقات</h2>
          <div class="attachment-list">
            ${attachmentMarkup || '<p class="attachment-empty">لا توجد مرفقات لهذا المنجز.</p>'}
          </div>
        </section>
      `;
    }

    loadWork().catch(error => {
      console.error(error);
      details.innerHTML = '<div class="work-error">حدث خطأ أثناء تحميل تفاصيل المنجز.</div>';
    });

  </script>

</body>
</html>
